name: Sideload Sentinel Android validation

on:
  push:
    branches: [main, "feat/sideload-sentinel-hardening"]
    paths:
      - "fire-os/**"
      - "scripts/verify-apk.ps1"
      - "docs/SIDELOAD_SENTINEL.md"
      - ".github/workflows/sideload-sentinel.yml"
  pull_request:
    paths:
      - "fire-os/**"
      - "scripts/verify-apk.ps1"
      - "docs/SIDELOAD_SENTINEL.md"
      - ".github/workflows/sideload-sentinel.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APK_PATH: fire-os/android/app/build/outputs/apk/debug/app-debug.apk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Android SDK components
        uses: android-actions/setup-android@v4
        with:
          # Avoid the removed legacy "tools" SDK package.
          packages: platform-tools

      - name: Install project Android platform and Build Tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Install root workspaces
        run: npm ci

      - name: Install Fire OS dependencies
        run: npm install --prefix fire-os --no-audit --no-fund

      - name: Build Android/Fire TV debug APK
        run: |
          chmod +x fire-os/android/gradlew
          fire-os/android/gradlew --no-daemon -p fire-os/android app:testDebugUnitTest app:assembleDebug

      - name: Verify build artifact signature with Android SDK apksigner
        shell: bash
        run: |
          SIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$SIGNER"
          echo "$(dirname "$SIGNER")" >> "$GITHUB_PATH"
          "$SIGNER" verify --verbose --print-certs "$APK_PATH"
          sha256sum "$APK_PATH"

      - name: Test PowerShell verifier on valid artifact
        shell: pwsh
        run: ./scripts/verify-apk.ps1 -ApkPath $env:APK_PATH

      - name: Test reference hash match
        shell: pwsh
        run: |
          $hash = (Get-FileHash -LiteralPath $env:APK_PATH -Algorithm SHA256).Hash
          ./scripts/verify-apk.ps1 -ApkPath $env:APK_PATH -ExpectedSha256 $hash

      - name: Test reference hash mismatch exit code
        shell: bash
        run: |
          HASH="$(sha256sum "$APK_PATH" | cut -d " " -f 1)"
          WRONG="$(printf "0%.0s" {1..64})"
          if [ "$HASH" = "$WRONG" ]; then WRONG="$(printf "1%.0s" {1..64})"; fi
          set +e
          pwsh -NoProfile -File scripts/verify-apk.ps1 -ApkPath "$APK_PATH" -ExpectedSha256 "$WRONG"
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 4 ]; then echo "Expected exit 4 for a trusted-hash mismatch, got $STATUS"; exit 1; fi

      - name: Test non-APK input is rejected
        shell: bash
        run: |
          cp "$APK_PATH" "$RUNNER_TEMP/not-an-apk.txt"
          set +e
          pwsh -NoProfile -File scripts/verify-apk.ps1 -ApkPath "$RUNNER_TEMP/not-an-apk.txt"
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 2 ]; then echo "Expected exit 2 for non-APK input, got $STATUS"; exit 1; fi

      - name: Test signature tampering is rejected
        shell: bash
        run: |
          python3 - "$APK_PATH" "$RUNNER_TEMP/tampered.apk" <<'PY'
          import pathlib
          import sys
          source = pathlib.Path(sys.argv[1]).read_bytes()
          if len(source) < 256:
              raise SystemExit("APK fixture is too small to tamper safely")
          changed = bytearray(source)
          changed[128] ^= 0x01
          pathlib.Path(sys.argv[2]).write_bytes(changed)
          PY
          set +e
          pwsh -NoProfile -File scripts/verify-apk.ps1 -ApkPath "$RUNNER_TEMP/tampered.apk"
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 1 ]; then echo "Expected exit 1 for a modified APK, got $STATUS"; exit 1; fi
      